# Ship to Hugging Face Spaces on every push to main.
#
# GitHub Actions cannot host this app -- a runner is destroyed when the job
# ends, and Pages serves static files only, which leaves the FastAPI backend
# (recommendations, chat, speech-to-text) with nowhere to run. So this
# automates the push to the Space rather than replacing it.
#
# Required repository settings:
#   Secret   HF_TOKEN        a write token from huggingface.co/settings/tokens
#   Variable HF_USERNAME     your Hugging Face username
#   Secret   GROK_API_KEY    optional; keeps the Space's key in sync
#
# The frontend build, the dependency install and the model training all happen
# inside the Space's Docker build, so this workflow only uploads source.

name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# A newer push should supersede an in-flight deploy rather than race it.
concurrency:
  group: hf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Hugging Face CLI
        run: pip install --quiet "huggingface_hub[cli]"

      - name: Deploy
        env:
          # The hf CLI authenticates from HF_TOKEN, so deploy.sh's `hf auth
          # whoami` check passes without an interactive login.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ]; then
            echo "::error::Set the HF_TOKEN secret and the HF_USERNAME variable."
            exit 1
          fi
          ./deploy.sh "$HF_USERNAME"
