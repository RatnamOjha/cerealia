# Keep the Hugging Face Space awake.
#
# Free `cpu-basic` Spaces are paused after 48 hours of inactivity and cannot
# opt out -- `hf spaces settings --sleep-time 0` requires upgraded hardware.
# The next visitor then waits 30-90s for a cold start, which is exactly the
# first impression a reviewer clicking your link would get.
#
# A request every 6 hours keeps the idle timer from ever reaching 48h.
# Set the SPACE_URL repository variable to your Space, e.g.
#   https://<user>-cerealia.hf.space

name: Keep Space awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "SPACE_URL repository variable is not set — nothing to ping."
            exit 1
          fi
          # A sleeping Space answers slowly rather than quickly, so allow for a
          # cold start rather than failing the run that is waking it up.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 180 \
                 "${SPACE_URL%/}/api/health")
          echo "GET ${SPACE_URL%/}/api/health -> $code"
          [ "$code" = "200" ]
