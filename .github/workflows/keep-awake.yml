# Keep the Render service awake.
#
# Render's free instances spin down after 15 minutes without traffic, and the
# next visitor waits 30-60s for the container to boot. Pinging inside that
# window keeps the timer from ever expiring.
#
# The cron asks for every 10 minutes. GitHub does not honour that precisely --
# scheduled workflows are queued at low priority and can be delayed by 10+
# minutes under load -- so some cold starts will still slip through. This
# narrows the odds; it does not eliminate them. The reliable fix is a paid
# instance that never sleeps.
#
# Set the APP_URL repository variable to your service, e.g.
#   https://cerealia.onrender.com   (or your Porkbun domain once DNS resolves)
#
# Note: GitHub disables scheduled workflows on repos with no activity for 60
# days. A single commit re-enables them.

name: Keep app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Skip rather than fail when unconfigured: this runs every 10 minutes,
          # and a red cross on the repo every 10 minutes is noise, not a signal.
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL is not set — nothing to ping. Set it in Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi
          # A sleeping instance answers slowly rather than quickly, so allow for
          # a cold start rather than failing the run that is waking it up.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 180 \
                 "${APP_URL%/}/api/health")
          echo "GET ${APP_URL%/}/api/health -> $code"
          [ "$code" = "200" ]
