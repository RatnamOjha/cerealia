name: Research PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/research-evaluation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-integrity:
    # The recorded experiment was run on macOS/ARM64. Match that architecture
    # for byte-for-byte classifier reproducibility; serving/build checks stay Linux.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install pinned research environment
        run: python -m pip install -r research/requirements.txt
      - name: Verify committed artifact integrity
        run: python -m unittest discover -s research/tests -v
      - name: Re-run protocol and compare numerical artifact hashes
        run: python research/verify_reproducibility.py

  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Train the production model used by the API smoke test
        run: python backend/train.py
      - name: Smoke test existing API and production artifact routes
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          assert client.get("/api/health").status_code == 200
          assert client.get("/api/states").status_code == 200
          manifest = client.get("/research-artifacts/manifest.json")
          assert manifest.status_code == 200 and manifest.json()["run_id"]
          figure = client.get("/research-artifacts/figures/classifier_noise_accuracy.png")
          assert figure.status_code == 200 and figure.content.startswith(b"\x89PNG")
          recommendation = client.post("/api/recommend/state", json={"state_id": "PB", "top_n": 1})
          assert recommendation.status_code == 200
          assert recommendation.json()["recommendations"]
          print("Backend API and production artifact smoke checks passed.")
          PY

  vite-development-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install API and frontend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci
      - name: Verify Vite proxies research artifacts to FastAPI
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/cerealia-api.log 2>&1) &
          API_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 > /tmp/cerealia-vite.log 2>&1) &
          VITE_PID=$!
          trap 'kill "$API_PID" "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/research-artifacts/manifest.json -o /tmp/cerealia-manifest.json; then break; fi
            sleep 1
          done
          python -c 'import json; m=json.load(open("/tmp/cerealia-manifest.json")); assert m["run_id"]'
          curl -fsS http://127.0.0.1:5173/research-artifacts/figures/classifier_noise_accuracy.png -o /tmp/cerealia-figure.png
          python -c 'from pathlib import Path; assert Path("/tmp/cerealia-figure.png").read_bytes().startswith(b"\x89PNG")'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

  production-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag cerealia:${{ github.sha }} .
